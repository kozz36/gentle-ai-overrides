name: Test

on:
  push:
  pull_request:

jobs:
  shell:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Install ShellCheck
        if: runner.os == 'macOS'
        run: brew install jq shellcheck
      - name: Check Bash syntax
        run: bash -n apply.sh tests/run.sh
      - name: Run ShellCheck
        run: shellcheck --severity=warning apply.sh tests/run.sh
      - name: Run regression tests
        run: bash tests/run.sh
